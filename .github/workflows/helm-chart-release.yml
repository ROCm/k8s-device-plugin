name: Release Helm Charts

on:
  workflow_dispatch:
  push:
    branches:
      - master

# chart-releaser pushes the packaged charts and creates a release; contents is
# the only elevated scope it needs. Without this block GITHUB_TOKEN defaults to
# write-all and is handed to a third-party action below via CR_TOKEN.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keep GITHUB_TOKEN out of .git/config, where any later step could
          # read it. chart-releaser authenticates with CR_TOKEN instead.
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@df287104677278f869ca5480bd260358397cc3f9 # v1.8.0
        with:
          # The charts directory
          charts_dir: helm
          # The GitHub Pages URL to the charts repo (default: https://<owner>.github.io/<repo>)
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NAME_TEMPLATE: "{{ .Name }}-helm-{{ .Version }}"
          CR_PAGES_BRANCH: "helm-chart-release"
