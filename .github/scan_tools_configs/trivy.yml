# trivy configuration
# Reference: https://trivy.dev/latest/docs/references/configuration/config-file/
# Local scan: trivy fs --config .github/scan_tools_configs/trivy.yml .
#
# Trivy configuration for this repository's security scans.
#
# This file defines the complete scanner policy;
# Keep repository-specific suppressions and tuning here.

# Suppressing one check on one file would be the right tool here, and this
# repository cannot reach it. Trivy spells that as an ignore file, but it
# resolves `ignorefile` against the process working directory, and the shared
# scan workflow runs trivy from the directory above the checkout -- so no
# committed path reaches it, and a wrong one is fatal rather than ignored.
# Inline `#trivy:ignore:` comments are the per-check alternative, and only the
# Dockerfile scanner honours them (`WithSupportsInlineIgnore`); the Kubernetes
# scanner does not. The Dockerfiles therefore carry inline ignores, and the
# manifests below are skipped wholesale, which is coarser than intended: a new
# finding in one of these files will not be reported. Narrow this to per-check
# ignores once the shared workflow can pass `--ignorefile`.
scan:
  # Environment and generated-output exclusions support local scans; these
  # paths are absent from clean CI checkouts. `vendor` is the exception: it is
  # committed, and it carries upstream test fixtures (for example
  # k8s.io/apimachinery's managedfields/pod.yaml) that are never deployed and
  # that `go mod vendor` would overwrite if they were edited.
  skip-dirs:
    - .git
    - .venv*
    - venv*
    - build
    - dist
    - node_modules
    - __pycache__
    - vendor

  skip-files:
    # A device plugin is privileged by construction: it enumerates GPUs
    # through /sys and /dev/kfd, and registers over the kubelet's
    # device-plugin socket. KSV-0005 (SYS_ADMIN), KSV-0017 (privileged),
    # KSV-0121 (hostPath) and KSV-0118 have no fix that leaves a working
    # plugin, and KSV-0014 (readOnlyRootFilesystem) would block the socket.
    - k8s-ds-amdgpu-dp.yaml
    - k8s-ds-amdgpu-dp-health.yaml
    - k8s-ds-amdgpu-dp-with-init-container.yaml
    - k8s-ds-amdgpu-labeller.yaml
    - k8s-ds-amdgpu-labeller-with-init-container.yaml

    # Example workloads. Two checks fire here that should not be "fixed":
    # KSV-0008 (hostIPC) is part of the configuration that
    # docs/user-guide/configuration.md documents as tested for non-privileged
    # GPU access, and KSV-0014 (readOnlyRootFilesystem) would need a writable
    # emptyDir for every JIT and kernel cache a ROCm image writes -- a set
    # that differs per framework and per image tag, and that no CI here can
    # validate on GPU hardware. The security contexts these manifests do
    # carry are set explicitly rather than inherited.
    - example/pod/jax-multi-gpu.yaml
    - example/pod/jax-non-privileged.yaml
    - example/pod/pytorch.yaml
    - example/pod/pytorch-non-privileged.yaml
    - example/pod/tensorflow-gpu.yaml
    - example/vllm-serve/deployment.yaml
