# trivy configuration
# Reference: https://trivy.dev/latest/docs/references/configuration/config-file/
# Local scan, with the scanners and ignore file the shared workflow passes
# (trivy does not look for an ignore file beside --config):
#   trivy fs --scanners misconfig,vuln,license \
#     --config .github/scan_tools_configs/trivy.yml \
#     --ignorefile .github/scan_tools_configs/.trivyignore.yaml .
#
# Trivy configuration for this repository's security scans.
#
# This file defines the complete scanner policy.
# Keep repository-specific suppressions and tuning here.
#
# Ways to suppress a finding, narrowest first:
#
#   1. `.trivyignore.yaml` -- one check ID with the files it applies to, and a
#      statement that records why. Every other file keeps the check.
#      Reference: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
#      Keep it beside this file (`.github/scan_tools_configs/.trivyignore.yaml`).
#      The shared workflow prefers it over a `.trivyignore`, and the two are
#      never merged. The file here holds this repository's suppressions.
#
#   2. `scan.skip-dirs` below -- paths trivy never reads, for vendored trees
#      and generated output. Nothing in them is scanned at all, so keep
#      entries narrow and never use them to silence a finding.

# Environment and generated-output exclusions support local scans; these
# paths are absent from clean CI checkouts.
scan:
  # Environment and generated-output exclusions support local scans; these
  # paths are absent from clean CI checkouts. `vendor` is the exception: it is
  # committed, and it carries upstream test fixtures (for example
  # k8s.io/apimachinery's managedfields/pod.yaml) that are never deployed and
  # that `go mod vendor` would overwrite if they were edited.
  skip-dirs:
    - .git
    - .venv*
    - venv*
    - build
    - dist
    - node_modules
    - __pycache__
    - vendor
